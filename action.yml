name: 'AgentSec AI Agent Security Scanner'
description: 'Static security scanner for AI coding agents, Cursor rules, and MCP configurations'
author: 'locface'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  path:
    description: 'Target directory to scan'
    required: false
    default: '.'
  fail_on:
    description: 'Minimum severity to fail the job (critical, high, medium, low)'
    required: false
    default: 'high'
  severity:
    description: 'Minimum severity to include in report (critical, high, medium, low, all)'
    required: false
    default: 'all'
  format:
    description: 'Output format (terminal, json, markdown, sarif)'
    required: false
    default: 'sarif'
  sarif_file:
    description: 'File path to save SARIF report'
    required: false
    default: 'agentsec-results.sarif'
  ignore_file:
    description: 'Path to custom .agentsecignore file'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install AgentSec
      shell: bash
      run: |
        pip install --upgrade agentsec-cli

    - name: Run AgentSec Scan
      shell: bash
      run: |
        CMD="agentsec scan ${{ inputs.path }} --format ${{ inputs.format }} --severity ${{ inputs.severity }}"
        if [ -n "${{ inputs.fail_on }}" ]; then
          CMD="$CMD --fail-on ${{ inputs.fail_on }}"
        fi
        if [ -n "${{ inputs.ignore_file }}" ]; then
          CMD="$CMD --ignore-file ${{ inputs.ignore_file }}"
        fi
        if [ "${{ inputs.format }}" = "sarif" ]; then
          $CMD > "${{ inputs.sarif_file }}"
        else
          $CMD
        fi
